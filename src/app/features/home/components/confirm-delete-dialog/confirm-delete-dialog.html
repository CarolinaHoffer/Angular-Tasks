<div class="delete-dialog">

  <div class="delete-icon">
    <mat-icon>delete_outline</mat-icon>
  </div>

  <h2>{{ data.title }}</h2>

  <p>{{ data.message }}</p>

  <div class="dialog-actions">

    <button
      mat-button
      type="button"
      (click)="cancel()"
    >
      Cancelar
    </button>

    <button
      mat-flat-button
      class="delete-button"
      type="button"
      (click)="confirm()"
    >
      <mat-icon>delete</mat-icon>
      Borrar
    </button>

  </div>

</div>
