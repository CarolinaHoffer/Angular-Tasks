<div class="home-container">
  <app-top-navbar (menuToggle)="toggleSideNavbar()"/>

<mat-sidenav-container class="home-container">

  <mat-sidenav #sidenav [mode]="isOver ? 'over' : 'side'" [opened]="!isMobile">
    <app-side-navbar (addTask)="openAddTaskModal()" [labels]="labels" (viewSelected)="selectView($event)" />
  </mat-sidenav>
    <mat-sidenav-content>
    
    <main class="home-content"> 

    <div class="descriptionAndSearch">
      <div class="description">
        <h1>Mis Tareas</h1>
        <span class="subtitle">Organizá. Completá. Crecé</span>
      </div>
      <div class="searchForm">

      <form  [formGroup]="searchForm">    
        <mat-form-field appearance="outline">
              <mat-label>Buscar tarea</mat-label>
              <input
                matInput
                formControlName="search"
                placeholder="Buscar por título..."
              >
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Todos las etiquetas</mat-label>
              <mat-select formControlName="labels">
                <mat-option [value]="null">
                  Todos
                </mat-option>
                @for (label of labels; track label.id) {
                  <mat-option [value]="label.id">
                    {{ label.name }}
                  </mat-option>
                }
              </mat-select>
            </mat-form-field>
        </form>
        
        <button mat-icon-button  [matMenuTriggerFor]="labelMenu" aria-label="Opciones de etiquetas" class="options-button"
        >
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #labelMenu="matMenu">
            <button mat-menu-item (click)="openAddLabelModal()">
                <mat-icon>add</mat-icon>
                <span>Agregar</span> 
            </button>
            <button mat-menu-item (click)="editLabel()" [disabled]="searchForm.controls.labels.value === null">
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
            </button>

            <button mat-menu-item (click)="deleteLabel()" [disabled]="searchForm.controls.labels.value === null">
                <mat-icon>delete</mat-icon>
                <span>Borrar</span> 
            </button>
        </mat-menu>
      </div>
  </div>
    <app-task-view [tasks]="filteredTasks" [labels]="labels" (taskEdit)="editTask($event)" (taskConfirmSave)="taskConfirmSave()" />
  </main>
  </mat-sidenav-content>
</mat-sidenav-container>
</div>
